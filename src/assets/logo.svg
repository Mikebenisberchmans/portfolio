<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Rough hand-painted brush edge filter -->
    <filter id="brush-edge" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.065" numOctaves="4" seed="12" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Textured Circular Brush Stroke -->
  <g filter="url(#brush-edge)">
    <circle cx="150" cy="150" r="134" fill="#F44336" />
    <!-- Outer dry-brush accents -->
    <circle cx="150" cy="150" r="138" fill="none" stroke="#F44336" stroke-width="4" stroke-dasharray="55 18 12 24 85 15" />
    <circle cx="150" cy="150" r="142" fill="none" stroke="#F44336" stroke-width="2" stroke-dasharray="25 40 10 30 60 35" />
  </g>

  <!-- Bold Blocky White Letter "M" -->
  <path d="M 74 62
       Q 106 60 130 62
       L 150 108
       L 170 62
       Q 194 60 226 62
       Q 234 150 228 240
       L 182 240
       L 182 156
       C 182 146 168 146 165 155
       L 156 182
       C 153 190 147 190 144 182
       L 135 155
       C 132 146 118 146 118 156
       L 118 240
       L 72 240
       Q 66 150 74 62 Z" fill="#FFFFFF" />
</svg>